<meta charset="utf-8">
<title>Batalla de Brawlground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: pantalla de juego: campo arriba, mazo y energía abajo (como en vertical en el móvil). */
:root {
  color-scheme: dark;
  --bg: #161b2b; --panel: #252e48; --panel-hi: #33406a; --ink: #f4f1e8; --muted: #a9b2cc;
  --outline: #1e2235; --gold: #ffc83d; --energy: #b06bff; --energy-hi: #d8b4ff;
  --common: #9aa3bd; --rare: #4da3ff; --epic: #a855f7;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
html, body { height: auto; }
[hidden] { display: none !important; }
.dock > *, .wrap > *, .stage { min-width: 0; }
#game canvas { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-weight: 600; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 12px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; }
header { display: flex; align-items: center; gap: 12px; }
header img { width: 56px; height: auto; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 0; line-height: 1; }
header p { margin: 3px 0 0; color: var(--muted); font-size: .9rem; }
header .tools { margin-left: auto; display: flex; gap: 8px; }
.btn { font-family: var(--font-display); font-size: 1rem; letter-spacing: .02em; cursor: pointer;
  background: var(--panel-hi); color: var(--ink); border: 3px solid var(--outline); border-radius: 12px; padding: 7px 12px;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.12), 0 3px 0 var(--outline); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 3px 0 rgba(255,255,255,.12), 0 1px 0 var(--outline); }
.btn.gold { background: var(--gold); color: var(--outline); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.stage { position: relative; }
#game { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border: 4px solid var(--outline); border-radius: 18px; overflow: hidden; background: #7fb85a; }
#game canvas { display: block; }
#over { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(14,17,30,.55); border-radius: 18px; }
#over .panel { background: var(--panel); border: 4px solid var(--outline); border-radius: 18px; padding: 18px 26px; text-align: center; box-shadow: 0 6px 0 var(--outline); }
#over h2 { font-family: var(--font-display); font-weight: 400; font-size: 2.4rem; margin: 0 0 4px; }
#over p { margin: 0 0 14px; color: var(--muted); }
.dock { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; background: var(--panel); border: 4px solid var(--outline); border-radius: 18px; padding: 12px; }
.energy { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.ebar { position: relative; flex: 1; height: 22px; background: #141826; border: 3px solid var(--outline); border-radius: 12px; overflow: hidden; }
#efill { position: absolute; inset: 0 auto 0 0; width: 50%; background: linear-gradient(var(--energy-hi), var(--energy)); }
.eticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 3px), var(--outline) calc(10% - 3px) 10%); }
#enum { font-family: var(--font-display); font-size: 1.6rem; min-width: 2ch; text-align: center; color: var(--energy-hi); font-variant-numeric: tabular-nums; }
.hand { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; min-width: 0; max-width: 520px; }
.hc { position: relative; padding: 5px 5px 4px; border: 3px solid var(--outline); border-radius: 12px; cursor: pointer; background: var(--common);
  box-shadow: 0 4px 0 var(--outline); display: grid; gap: 2px; min-width: 0; transition: transform .08s, filter .15s; }
.hc.rara { background: var(--rare); } .hc.epica { background: var(--epic); }
.hc img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 2px solid var(--outline); border-radius: 8px; background: #c7cde0; }
.hc .nm { font-family: var(--font-display); font-size: .9rem; color: var(--outline); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hc .cost { position: absolute; top: -10px; left: -10px; width: 32px; height: 32px; border-radius: 50%; background: var(--energy); border: 3px solid var(--outline);
  display: grid; place-items: center; font-family: var(--font-display); color: #fff; font-size: 1.05rem; text-shadow: 0 2px 0 var(--outline); }
.hc.poor { filter: grayscale(.85) brightness(.7); cursor: default; }
.hc:not(.poor):active { transform: translateY(3px); }
.side { display: grid; gap: 8px; justify-items: center; }
.next { font-size: .75rem; color: var(--muted); text-align: center; display: grid; gap: 3px; justify-items: center; }
.next img { width: 52px; height: 52px; border: 3px solid var(--outline); border-radius: 10px; object-fit: cover; background: #c7cde0; filter: brightness(.85); }
#hero { font-family: var(--font-display); background: #4a3a1a; color: var(--gold); border: 3px solid var(--outline); border-radius: 12px; padding: 6px 10px; display: grid; gap: 2px; justify-items: center; }
#hero span { font-family: var(--font-body); font-size: .75rem; color: var(--ink); font-variant-numeric: tabular-nums; }
#hero:disabled { opacity: .85; cursor: default; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; max-width: 70ch; }
@media (max-width: 520px) { .dock { grid-template-columns: 1fr; } .side { grid-template-columns: auto auto; justify-content: center; } .hc .nm { font-size: .75rem; } }
</style>

<div class="wrap">
  <header>
    <img src="img/logo.png" alt="Brawlground">
    <div><h1>Batalla</h1><p>Primera partida jugable contra la IA.</p></div>
    <div class="tools"><button class="btn" id="speed" aria-pressed="false">x1</button><button class="btn" id="restart">Reiniciar</button></div>
  </header>
  <div class="stage">
    <div id="game"></div>
    <div id="over" hidden><div class="panel"><h2 id="over-title"></h2><p id="over-text"></p><button class="btn gold" id="again">Jugar otra vez</button></div></div>
  </div>
  <div class="dock">
    <div class="energy"><div class="ebar" aria-label="Energía"><div id="efill"></div><div class="eticks"></div></div><span id="enum">5</span></div>
    <div class="hand" id="hand"></div>
    <div class="side">
      <div class="next">Siguiente<img id="next" alt=""></div>
      <button id="hero" disabled title="El héroe llegará cuando tengamos su arte">Héroe<span id="herok">0/15 bajas</span></button>
    </div>
  </div>
  <p class="hint">Toca una carta para sacar la unidad desde tu castillo (izquierda). La energía se recarga sola y con cada enemigo abatido. Las torres de los castillos disparan a quien se acerca. Gana quien derribe el castillo rival.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
(() => {
'use strict';
const W = 960, HGT = 540, GROUND = 410, H = 120;
const OUT = 0x1e2235, BLUE = 0x3b82f6, PURPLE = 0x8b5cf6, STRING = 0xf6e3c6;
const ease = p => p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3);
const easeIn = p => p < 0 ? 0 : p > 1 ? 1 : p * p * p;
const easeInOut = p => p < 0 ? 0 : p > 1 ? 1 : p * p * (3 - 2 * p);
const lerp = (a, b, p) => a + (b - a) * p;
const lerp2 = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p)];
const rand = (a, b) => a + Math.random() * (b - a);

// Datos de cada personaje. Posiciones en alturas de cuerpo (H), relativas a los pies, medidas sobre la imagen completa aprobada.
const CH = {
  legionario: { hp: 100, dmg: [10, 14], speed: 58, cd: [1.05, 1.4], range: H * 1.15, ranged: false,
    h: 1, rest: { sw: -1.97, bh: [-0.207, -0.165], fh: [0.245, -0.169], sh: [0.388, -0.215] } },
  arquera: { hp: 55, dmg: [10, 14], speed: 54, cd: [1.45, 1.85], range: H * 4.3, ranged: true, h: 1,
    rest: { bh: [-0.17, -0.211], fh: [0.321, -0.266] },
    bow: { h: 0.91, w: 0.91 * 123 / 512, ox: 0.30, oy: 0.5, tipX: 0.144, tipTop: 0.207, tipBot: 0.669, gripY: 0.742 } },
  // Montada: la jinete va detrás del caballo para que la silla y el cuello la tapen, como en la imagen aprobada.
  valkiria: { hp: 120, dmg: [18, 22], speed: 84, cd: [1.25, 1.55], range: H * 1.45, ranged: false, aoe: true, h: 1.3,
    rest: { sw: -1.71, bh: [-0.344, -0.584] }, mount: [0.091, 0], rider: [-0.015, -0.282] },
  // Dos kunai, bufanda animada aparte y teletransporte detrás de las unidades a distancia enemigas.
  ninja: { hp: 60, dmg: [15, 19], speed: 74, cd: [0.45, 0.65], range: H * 0.95, ranged: false, h: 1, tpCd: 9,
    rest: { bk: 2.37, fk: -0.757, bh: [-0.213, -0.177], fh: [0.196, -0.177] }, scarf: [-0.149, -0.297] },
  // Dos revólveres: ráfaga alterna a media distancia y giro del revólver en el dedo.
  pistolero: { hp: 60, dmg: [11, 13], speed: 56, cd: [1.4, 1.8], range: H * 2.7, ranged: true, h: 1,
    rest: { bg: -2.1, fg: 0, bh: [-0.267, -0.296], fh: [0.246, -0.296] } },
  // Animal sin manos: cabeza (dos versiones), cuerpo y cola por separado. Embestida al ver a un enemigo cerca.
  lobo: { hp: 50, dmg: [19, 21], speed: 108, cd: [0.7, 0.9], range: H * 0.78, ranged: false, h: 0.85,
    rest: { bh: [0, 0] }, tail: [-0.257, -0.353], body: [-0.0345, 0], head: [-0.036, -0.242] },
  // Iaido: la katana vive en la vaina; desenvaina con un tajo ascendente y vuelve a envainar.
  samurai: { hp: 140, dmg: [17, 21], speed: 52, cd: [1.3, 1.6], range: H * 1.2, ranged: false, h: 1,
    rest: { bh: [-0.087, -0.202], fh: [0.229, -0.222] }, saya: [0.02, -0.19], sayaR: -0.22 },
  // Combo de tres puñetazos y golpe de palma que empuja; trenza con física de muelle.
  kungfu: { hp: 40, dmg: [3, 4], palm: [5, 7], speed: 76, cd: [0.6, 0.8], range: H * 0.85, ranged: false, h: 1,
    rest: { bh: [-0.208, -0.468], fh: [0.3, -0.481] }, braid: [-0.135, -0.95], braidR: 0.25,
    torso: [-0.249, -1.01], hipB: [-0.091, -0.234], hipF: [0.083, -0.234] },
  // Pica larguísima: estocada desde lejos y daño extra contra unidades grandes y rápidas.
  tercio: { hp: 100, dmg: [14, 16], speed: 34, cd: [2.2, 2.6], range: H * 2.05, ranged: false, h: 1, bonusVs: { valkiria: 1.8, lobo: 1.8 }, push: 32, keepAway: H * 1.5,
    rest: { bh: [0.029, -0.187], fh: [0.176, -0.341], pr: -0.877 } }
};
const PIKE = { len: 2.0, ox: 0.255, gap: 0.21 };   // largo (en H), agarre trasero y separación entre manos
// rareza de cada carta y color de su aura (común sin aura)
const RARITY = { tercio: 'comun', legionario: 'comun', arquera: 'comun', lobo: 'comun', valkiria: 'rara', ninja: 'rara', samurai: 'rara', pistolero: 'epica', kungfu: 'epica' };
const AURA = { rara: { c: 0x4da3ff, rate: 5, big: 0.8 }, epica: { c: 0xa855f7, rate: 8, big: 1 }, legendaria: { c: 0xfbbf24, rate: 12, big: 1.2 }, ascendida: { c: 0xef4444, rate: 16, big: 1.4 } };
const KAT = { ox: 0.236, g2g: 0.084 };   // origen en la guarda; distancia de la empuñadura a la guarda (en H)
// revólver: punto de agarre y boca del cañón (fracciones de la imagen recortada)
const GUN = { ox: 0.154, oy: 0.692, mx: 1.0, my: 0.19, w: 512, h: 329 };
const BOW = CH.arquera.bow;
const bowW = BOW.w * H, bowH = BOW.h * H;
// posición del arco (su origen) para que la mano agarre el punto de agarre en reposo
const bowRestFromHand = h => [h[0] + (BOW.ox - BOW.tipX) * BOW.w, h[1] + (BOW.oy - BOW.gripY) * BOW.h];

let castles = {}, scene, mode = 'fight', animChar = 'legionario', timeScale = 1;
const NAMES = { legionario: 'Tulio, el Legionario', arquera: 'Ailin, la Arquera', valkiria: 'Brynja, la Valkiria', ninja: 'Kazú, el Ninja', pistolero: 'Cole, el Pistolero', lobo: 'Garra, el Lobo', samurai: 'Hayato, el Samurái', kungfu: 'Lin, el Monje', tercio: 'Rodrigo, el Tercio' };
const NEWEST = 'tercio';
let pickBlue = NEWEST, pickPurple = 'legionario';
let units = [], fx = [], loose = [], arrows = [], fxG;

class Unit {
  constructor(sc, type, team, x) {
    this.sc = sc; this.type = type; this.cfg = CH[type]; this.team = team;
    this.teamDir = team === 'blue' ? 1 : -1; this.dir = this.teamDir; this.homeX = x;
    this.root = sc.add.container(x, GROUND);
    const wide = type === 'valkiria';
    const sw = type === 'lobo' ? 0.9 : wide ? 1.15 : 0.62;
    this.shadow = sc.add.ellipse(wide ? H * 0.08 : 0, 0, H * sw, H * (wide ? 0.18 : 0.15), 0x10131f, 0.28);
    this.rig = sc.add.container(0, 0);
    const handScale = n => sc.add.image(0, 0, n);
    if (type === 'legionario') {
      this.body = sc.add.image(0, 0, 'leg_cuerpo').setOrigin(0.5, 1).setScale(H / 512);
      this.weapon = sc.add.image(0, 0, 'leg_arma').setOrigin(0.19, 0.5).setScale(0.5 * H / 512);
      this.bh = handScale('leg_mano').setScale(0.105 * H / 510);
      this.shield = sc.add.image(0, 0, 'leg_escudo').setScale(0.42 * H / 512);
      this.fh = handScale('leg_mano').setScale(0.105 * H / 510);
      this.parts = [this.body, this.weapon, this.bh, this.shield, this.fh];
      this.rig.add(this.parts);
      this.drops = [[this.weapon, -0.5, -520, 9], [this.shield, 0.9, -380, -5]];
    } else if (type === 'valkiria') {
      const f = H / 120;
      this.body = sc.add.image(0, 0, 'val_cuerpo').setOrigin(0.5, 1).setScale(0.2394 * f);
      this.mount = sc.add.image(0, 0, 'val_montura').setOrigin(0.5, 1).setScale(0.2748 * f);
      this.weapon = sc.add.image(0, 0, 'val_arma').setOrigin(0.41, 0.495).setScale(0.1344 * f);
      this.bh = handScale('val_mano').setScale(0.0297 * f);
      this.parts = [this.body, this.mount, this.weapon, this.bh];
      this.rig.add(this.parts);
      this.drops = [[this.weapon, -0.6, -560, 10]];
    } else if (type === 'tercio') {
      const f = H / 120;
      this.body = sc.add.image(0, 0, 'ter_cuerpo').setOrigin(0.517, 1).setScale(H / 512);
      this.pike = sc.add.image(0, 0, 'ter_pica').setOrigin(PIKE.ox, 0.5).setScale(PIKE.len * H / 1024);
      this.bh = handScale('ter_mano').setScale(0.085 * H / 484);
      this.fh = handScale('ter_mano').setScale(0.085 * H / 484);
      this.parts = [this.body, this.pike, this.bh, this.fh];
      this.rig.add(this.parts);
      this.drops = [[this.pike, -0.3, -420, 4]];
    } else if (type === 'kungfu') {
      const f = H / 120;
      // la trenza se corta en segmentos encadenados para que ondule como pelo
      const tex = sc.textures.get('kf_trenza'), src = tex.getSourceImage(), TW = src.width, TH = src.height;
      const N = 6, segH = TH / N, pad = 5;
      this.braidSegs = [];
      for (let i = 0; i < N; i++) {
        const name = 'seg' + i, y0 = Math.max(0, Math.round(i * segH - pad)), h = Math.min(TH - y0, Math.round(segH + pad * 2));
        if (!tex.has(name)) tex.add(name, 0, 0, y0, TW, h);
        const img = sc.add.image(0, 0, 'kf_trenza', name).setOrigin(0.5, (i * segH - y0) / h).setScale(0.2317 * f);
        this.braidSegs.push(img);
      }
      this.segLen = segH * 0.2317 * f;
      this.braidAng = new Array(N).fill(this.cfg.braidR); this.braidVel = new Array(N).fill(0);
      // torso y dos piernas (la misma pieza): la cadera queda tapada por el fajín
      this.legB = sc.add.image(0, 0, 'kf_pierna').setOrigin(0.495, 0.02).setScale(0.0556 * f);
      this.legF = sc.add.image(0, 0, 'kf_pierna').setOrigin(0.495, 0.02).setScale(0.0556 * f);
      this.body = sc.add.image(0, 0, 'kf_torso').setOrigin(0, 0).setScale(0.2054 * f);
      this.bh = sc.add.image(0, 0, 'kf_puno').setScale(0.0373 * f);
      this.fh = sc.add.image(0, 0, 'kf_puno').setScale(0.0373 * f);
      this.parts = [...this.braidSegs.slice().reverse(), this.legB, this.legF, this.body, this.bh, this.fh];
      this.rig.add(this.parts);

      this.drops = [];
    } else if (type === 'samurai') {
      const f = H / 120;
      this.body = sc.add.image(0, 0, 'sam_cuerpo').setOrigin(0.458, 1).setScale(H / 512);
      this.saya = sc.add.image(0, 0, 'sam_vaina').setOrigin(0.967, 0.5).setScale(0.13 * f);
      this.kat = sc.add.image(0, 0, 'sam_arma').setOrigin(KAT.ox, 0.5).setScale(0.17 * f);
      this.bh = handScale('leg_mano').setScale(0.1 * H / 510);
      this.fh = handScale('leg_mano').setScale(0.1 * H / 510);
      this.parts = [this.body, this.saya, this.kat, this.bh, this.fh];
      this.rig.add(this.parts);
      this.drops = [[this.kat, 0.6, -600, 12], [this.saya, -0.4, -420, -6]];
    } else if (type === 'lobo') {
      const f = H / 120;
      this.tail = sc.add.image(0, 0, 'lob_cola').setOrigin(0.943, 0.061).setScale(0.0607 * f);
      this.body = sc.add.image(0, 0, 'lob_cuerpo').setOrigin(0.5, 1).setScale(0.1554 * f);
      this.head = sc.add.image(0, 0, 'lob_cabeza').setOrigin(0.382, 0.739).setScale(0.1929 * f);
      this.parts = [this.tail, this.body, this.head];
      this.rig.add(this.parts);
      this.drops = [];
    } else if (type === 'pistolero') {
      const f = H / 120;
      this.body = sc.add.image(0, 0, 'pis_cuerpo').setOrigin(0.456, 1).setScale(H / 512);
      this.bg = sc.add.image(0, 0, 'pis_arma').setOrigin(GUN.ox, GUN.oy).setScale(0.0741 * f);
      this.bh = handScale('pis_mano').setScale(0.103 * H / 400);
      this.fg = sc.add.image(0, 0, 'pis_arma').setOrigin(GUN.ox, GUN.oy).setScale(0.0741 * f);
      this.fh = handScale('pis_mano').setScale(0.103 * H / 400);
      this.parts = [this.body, this.bg, this.bh, this.fg, this.fh];
      this.rig.add(this.parts);
      this.drops = [[this.bg, -0.6, -520, 14], [this.fg, 0.7, -580, -14]];
    } else if (type === 'ninja') {
      const f = H / 120;
      this.body = sc.add.image(0, 0, 'nin_cuerpo').setOrigin(0.483, 1).setScale(H / 512);
      this.scarf = sc.add.image(0, 0, 'nin_bufanda').setOrigin(0.555, 0.745).setScale(0.1562 * f);
      this.bk = sc.add.image(0, 0, 'nin_arma').setOrigin(0.31, 0.5).setScale(0.0802 * f);
      this.bh = handScale('nin_mano').setScale(0.103 * H / 469);
      this.fk = sc.add.image(0, 0, 'nin_arma').setOrigin(0.31, 0.5).setScale(0.0802 * f);
      this.fh = handScale('nin_mano').setScale(0.103 * H / 469);
      this.parts = [this.body, this.scarf, this.bk, this.bh, this.fk, this.fh];
      this.rig.add(this.parts);
      this.drops = [[this.bk, -0.6, -500, 12], [this.fk, 0.6, -560, -12]];
    } else {
      this.body = sc.add.image(0, 0, 'arq_cuerpo').setOrigin(0.5, 1).setScale(H / 512);
      this.weapon = sc.add.image(0, 0, 'arq_arma').setOrigin(BOW.ox, BOW.oy).setScale(bowH / 512);
      this.str = sc.add.graphics();
      this.arrow = sc.add.image(0, 0, 'arq_flecha').setOrigin(0.04, 0.5).setScale(0.6 * H / 512).setVisible(false);
      this.bh = handScale('arq_mano').setScale(0.12 * H / 479);
      this.fh = handScale('arq_mano').setScale(0.12 * H / 479);
      this.parts = [this.body, this.weapon, this.arrow, this.bh, this.fh];
      this.rig.add([this.body, this.weapon, this.str, this.arrow, this.bh, this.fh]);
      this.drops = [[this.weapon, 0.7, -480, 7]];
    }
    this.aura = AURA[RARITY[type]] || null;
    this.auraBack = sc.add.graphics(); this.auraFront = sc.add.graphics(); this.auraP = [];
    this.root.add([this.auraBack, this.shadow, this.rig, this.auraFront]);
    this.bar = sc.add.graphics().setDepth(900);
    this.reset(x);
  }

      L('val_cuerpo', 'valkiria_cuerpo'); L('val_montura', 'valkiria_montura'); L('val_arma', 'valkiria_arma'); L('val_mano', 'valkiria_mano');
      L('nin_cuerpo', 'ninja_cuerpo'); L('nin_bufanda', 'ninja_bufanda'); L('nin_arma', 'ninja_arma'); L('nin_mano', 'ninja_mano'); L('nin_shuriken', 'ninja_shuriken');
      L('pis_cuerpo', 'pistolero_cuerpo'); L('pis_arma', 'pistolero_arma'); L('pis_mano', 'pistolero_mano');
      L('lob_cuerpo', 'lobo_cuerpo'); L('lob_cabeza', 'lobo_cabeza'); L('lob_mordisco', 'lobo_cabeza_mordisco'); L('lob_cola', 'lobo_cola');
      L('sam_cuerpo', 'samurai_cuerpo'); L('sam_arma', 'samurai_arma'); L('sam_vaina', 'samurai_vaina');
      L('kf_torso', 'kungfu_torso'); L('kf_torso_esp', 'kungfu_torso_espalda');
      L('ter_cuerpo', 'tercio_cuerpo'); L('ter_pica', 'tercio_arma'); L('ter_mano', 'tercio_mano'); L('kf_pierna', 'kungfu_pierna'); L('kf_trenza', 'kungfu_trenza'); L('kf_puno', 'kungfu_puno'); L('kf_palma', 'kungfu_palma');
    }, create, update }
  });
}

/* ---- interfaz ---- */
const $ = id => document.getElementById(id);
function renderHand() {
  const h = $('hand'); h.innerHTML = '';
  B.blue.hand.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'hc ' + (RARITY[t] || 'comun'); b.dataset.i = i; b.setAttribute('aria-label', LABEL[t] + ', coste ' + COST[t]);
    b.innerHTML = '<span class="cost">' + COST[t] + '</span><img src="img/' + t + '_carta.png" alt=""><span class="nm">' + LABEL[t] + '</span>';
    b.onclick = () => play('blue', i);
    h.appendChild(b);
  });
  $('next').src = 'img/' + B.blue.queue[0] + '_carta.png'; $('next').alt = 'Siguiente: ' + LABEL[B.blue.queue[0]];
}
let lastUI = 0;
function uiTick() {
  const now = performance.now(); if (now - lastUI < 80) return; lastUI = now;
  const e = B.blue.energy;
  $('efill').style.width = (e / EMAX * 100) + '%'; $('enum').textContent = Math.floor(e);
  document.querySelectorAll('.hc').forEach(b => b.classList.toggle('poor', COST[B.blue.hand[+b.dataset.i]] > e));
  $('herok').textContent = Math.min(B.blue.kills, HERO_GOAL) + '/' + HERO_GOAL + ' bajas';
}
$('speed').onclick = e => { timeScale = timeScale === 1 ? 2 : 1; e.currentTarget.textContent = 'x' + timeScale; e.currentTarget.setAttribute('aria-pressed', timeScale === 2); };
$('restart').onclick = () => { if (scene) resetBattle(); };
$('again').onclick = () => { if (scene) resetBattle(); };
window.__debugBattle = () => ({ blue: { e: B.blue.energy, hand: B.blue.hand, hp: castles.blue.hp, kills: B.blue.kills }, purple: { e: B.purple.energy, hp: castles.purple.hp }, units: units.map(u => u.type + ':' + u.team + ':' + u.hp + ':' + Math.round(u.x)), over: B.over });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(start, start);
})();
</script>
